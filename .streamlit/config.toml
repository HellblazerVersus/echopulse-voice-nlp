# Codecademy-inspired Light Mode theme — crisp white, vivid purple, teal accents, JetBrains Mono

[theme]
base = "light"
primaryColor = "#7B2FBE"                # Codecademy vivid purple
backgroundColor = "#FFFFFF"             # Clean white canvas
secondaryBackgroundColor = "#F4F0FA"    # Soft lavender card surface
codeBackgroundColor = "#EDE8F5"
textColor = "#1A1A2E"                   # Deep navy text
linkColor = "#7B2FBE"
borderColor = "#D6CCF0"
codeTextColor = "#5A1F9A"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "6px"
buttonRadius = "6px"

# JetBrains Mono for ALL UI text
font = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
headingFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
headingFontSizes = ["28px", "22px", "18px", "16px", "14px", "12px"]
headingFontWeights = [700, 700, 600, 600, 500, 500]
linkUnderline = false

# Semantic palette (light-mode readable)
greenColor  = "#0F9D7E"   # Teal green — positive/success
redColor    = "#D92B4B"   # Deep red — negative/loss
yellowColor = "#E07B00"   # Amber — warning
orangeColor = "#C95C00"   # Orange — alert
blueColor   = "#0070CC"   # Blue — informational
violetColor = "#7B2FBE"   # Purple — accent
grayColor   = "#5C5F7A"   # Muted slate

# Chart palette: purple → teal → blue → red → amber sequence
chartCategoricalColors = [
    "#7B2FBE",
    "#0F9D7E",
    "#0070CC",
    "#D92B4B",
    "#E07B00",
    "#9B6DFF",
    "#C95C00",
    "#5C5F7A",
]

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
